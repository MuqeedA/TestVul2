# Builds the scan-and-gate image from Dockerfile and runs the same entrypoint
# customers use with docker run. Configure repository Variables and Secrets
# (see README.md or docs/ci-integration-flow.md).
name: APIsec scan and gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: apisec-scan-and-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apisec-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Run APIsec scan and enforce thresholds (Docker)
        env:
          APISEC_TOKEN: ${{ secrets.APISEC_TOKEN }}
          APISEC_HOST: https://api.dev.apisecapps.com
          APISEC_APP_ID: 019bff5b-65e2-72e7-840e-31fe245c2aff
          APISEC_INSTANCE_ID: 019bff5b-6f5a-7f14-8017-406d36572017
          APISEC_AUTH_ID: ${{ vars.APISEC_AUTH_ID }}
          APISEC_MAX_CRITICAL: "0"
          APISEC_MAX_HIGH: "5"
          IMAGE: docker.io/apisec/apisec-scan-and-gate:latest
        run: |
          docker run --rm \
            -e APISEC_TOKEN \
            -e APISEC_HOST \
            -e APISEC_APP_ID \
            -e APISEC_INSTANCE_ID \
            -e APISEC_AUTH_ID \
            -e APISEC_MAX_CRITICAL \
            -e APISEC_MAX_HIGH \
            "$IMAGE"
